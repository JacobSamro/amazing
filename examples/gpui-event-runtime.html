<!doctype html>
<title>Event runtime</title>
<style>
html, body { margin: 0px; padding: 0px; background: #f3e8fd; color: #4a148c; }
main { display: block; padding: 72px; }
h1 { display: block; font-size: 40px; }
p, a { font-size: 22px; }
</style>
<main>
  <h1 id="heading">Waiting for click</h1>
  <p><a id="action" href="should-not-open.html">Run click listener</a></p>
  <p id="timer">Timer waiting</p>
</main>
<script>
document.querySelector('#action').addEventListener('click', function(event) {
  event.preventDefault();
  document.querySelector('#heading').textContent = 'Click event repainted';
  document.title = 'Click handled';
});
setTimeout(function() {
  document.querySelector('#timer').textContent = 'Future timer repainted';
}, 1200);
</script>
