[workspace]
resolver = "2"
members = [
    "crates/amazing-common",
    "crates/amazing-html",
    "crates/amazing-css",
    "crates/amazing-dom",
    "crates/amazing-layout",
    "crates/amazing-js",
    "crates/amazing-media",
    "crates/amazing-net",
    "crates/amazing-paint",
    "crates/amazing",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
