[workspace]
resolver = "2"
members = [
    "crates/amazing-common",
    "crates/amazing-html",
    "crates/amazing-css",
    "crates/amazing-dom",
    "crates/amazing-layout",
    "crates/amazing-js",
    "crates/amazing-media",
    "crates/amazing-net",
    "crates/amazing-net-tls",
    "crates/amazing-paint",
    "crates/amazing-webrtc",
    "crates/amazing-webrtc-codecs",
    "crates/amazing-webrtc-crypto",
    "crates/amazing",
]
exclude = ["crates/amazing-shell-gpui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dev builds skip full debug info: the target directory lives on a slow
# external volume (see ~/.local/bin/cargo), and line tables keep backtraces
# usable at roughly half the artifact size and link time.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
lto = "off"
