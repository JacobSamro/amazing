[workspace]
resolver = "2"
members = [
    "crates/amazing-common",
    "crates/amazing-html",
    "crates/amazing-bindings",
    "crates/amazing-css",
    "crates/amazing-dom",
    "crates/amazing-layout",
    "crates/amazing-js",
    "crates/amazing-media",
    "crates/amazing-image",
    "crates/amazing-fetch",
    "crates/amazing-net",
    "crates/amazing-net-brotli",
    "crates/amazing-net-tls",
    "crates/amazing-paint",
    "crates/amazing-regex",
    "crates/amazing-svg",
    "crates/amazing-encoding",
    "crates/amazing-ipc",
    "crates/amazing-ipc-platform",
    "crates/amazing-process",
    "crates/amazing-compositor",
    "crates/amazing-canvas",
    "crates/amazing-storage",
    "crates/amazing-text",
    "crates/amazing-text-provider",
    "crates/amazing-webrtc",
    "crates/amazing-webrtc-codecs",
    "crates/amazing-webrtc-crypto",
    "crates/amazing",
]
exclude = ["crates/amazing-shell-gpui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dev builds skip full debug info: line tables keep backtraces and panic
# locations usable at roughly half the artifact size and link time.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
lto = "off"

# Dependencies carry no debug info: only our own crates get it, which is what
# backtraces actually read. Measured on a large workspace: average rlib
# 3.00 MB -> 1.08 MB, and 16,808 stray .o files -> 0.
[profile.dev.package."*"]
debug = false
