[package]
name = "amazing-webrtc-codecs"
description = "Isolated compressed-codec adapters for Amazing WebRTC"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
amazing-webrtc = { path = "../amazing-webrtc" }
media-codec-vpx = "=0.8.0"
media-codec = { version = "=0.9.1", default-features = false, features = ["decoder", "video"] }
media-core = { version = "=0.9.1", default-features = false, features = ["video"] }
opus2 = { version = "=0.4.0", default-features = false, features = ["backend-libopus", "bundled", "static"] }
