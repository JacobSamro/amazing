<!doctype html><meta charset=utf-8><style>
body{margin:0;background:white;display:flex;flex-wrap:wrap;width:384px;gap:8px;padding:12px}
div{width:64px;height:64px;background:linear-gradient(90deg,#c86432 50%,#145ac8 50%)}
</style><body>
<div style="filter:blur(3px)"></div><div style="filter:drop-shadow(5px 3px 2px #0048)"></div>
<div style="filter:brightness(.5)"></div><div style="filter:contrast(2)"></div>
<div style="filter:grayscale(1)"></div><div style="filter:hue-rotate(180deg)"></div>
<div style="filter:invert(1)"></div><div style="filter:opacity(.5)"></div>
<div style="filter:saturate(0)"></div><div style="filter:sepia(1)"></div>
<section style="filter:invert(1)"><div style="filter:brightness(.5)"></div></section>
<div style="filter:blur(3px);clip-path:inset(8px)"></div>
