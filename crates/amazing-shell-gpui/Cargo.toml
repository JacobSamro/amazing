[package]
name = "amazing-shell-gpui"
description = "GPUI desktop shell for the Amazing browser engine"
edition = "2024"
version = "0.0.1"
license = "MIT"
rust-version = "1.89"

[dependencies]
amazing-css = { path = "../amazing-css" }
amazing-compositor = { path = "../amazing-compositor" }
amazing-dom = { path = "../amazing-dom" }
amazing-fetch = { path = "../amazing-fetch" }
amazing-html = { path = "../amazing-html" }
amazing-js = { path = "../amazing-js" }
amazing-layout = { path = "../amazing-layout" }
amazing-media = { path = "../amazing-media" }
amazing-image = { path = "../amazing-image" }
amazing-net = { path = "../amazing-net" }
amazing-paint = { path = "../amazing-paint" }
amazing-webrtc-codecs = { path = "../amazing-webrtc-codecs" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "d9ad6aff67e47de43abb270d22de75dd950f1b48" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d9ad6aff67e47de43abb270d22de75dd950f1b48" }
image = { version = "0.25.9", default-features = false, features = [] }
windows-sys = { version = "0.61.2", features = ["Win32_Media_Audio"] }

[[bin]]
name = "amazing-shell"
path = "src/main.rs"

[[test]]
name = "compositor_presenter"
path = "src/compositor_presenter.rs"

[[bin]]
name = "amazing-compositor-proof"
path = "src/bin/compositor_proof.rs"
test = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dependencies carry no debug info: only our own crates get it, which is what
# backtraces actually read. Measured on a large workspace: average rlib
# 3.00 MB -> 1.08 MB, and 16,808 stray .o files -> 0.
[profile.dev.package."*"]
debug = false

[workspace]
resolver = "2"
members = ["../amazing-image"]
