[package]
name = "amazing-ipc-platform"
description = "Audited OS shared-memory and handle transfer for amazing-ipc (ADR 0007)"
edition = "2021"
version.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
