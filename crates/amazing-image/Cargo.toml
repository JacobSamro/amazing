[package]
name = "amazing-image"
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.89"
description = "Bounded image decoder adapter; provider-neutral owned RGBA output"

[dependencies]
amazing-svg = { path = "../amazing-svg" }
amazing-css = { path = "../amazing-css" }
amazing-media = { path = "../amazing-media" }
amazing-dom = { path = "../amazing-dom" }
image = { version = "=0.25.9", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "webp"] }

[dev-dependencies]
amazing-html = { path = "../amazing-html" }
amazing-layout = { path = "../amazing-layout" }
amazing-paint = { path = "../amazing-paint" }
amazing-fetch = { path = "../amazing-fetch" }
amazing-net = { path = "../amazing-net" }
