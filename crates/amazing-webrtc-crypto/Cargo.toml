[package]
name = "amazing-webrtc-crypto"
description = "Vetted DTLS-SRTP infrastructure adapter for Amazing"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
amazing-webrtc = { path = "../amazing-webrtc" }
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time"] }
webrtc-dtls = "=0.12.0"
webrtc-srtp = "=0.17.2"
webrtc-util = { version = "=0.11.0", default-features = false, features = ["conn"] }
zeroize = "=1.9.0"
