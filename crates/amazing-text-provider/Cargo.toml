[package]
name = "amazing-text-provider"
description = "Isolated safe adapter for OpenType shaping, Unicode analysis, and glyph rasterization"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
amazing-text = { path = "../amazing-text" }
brotli-decompressor = "=5.0.3"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
harfrust = "=0.13.2"
icu_segmenter = "=2.3.0"
# Pinned to the exact version harfrust 0.13.2 depends on (see Cargo.lock), so
# this is not a second copy of the font-parsing stack: it gives GSUB feature
# and cmap table access (`TableProvider`) on the same `harfrust::FontRef`
# already used for shaping, for the font-variant-caps/-position synthesis
# fallback's "does the selected face support this feature" check.
read-fonts = "=0.43.2"
swash = "=0.2.10"
unicode-bidi = "=0.3.18"
unicode-vo = "=0.1.0"
wuff = { version = "=0.2.8", default-features = false }
